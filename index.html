<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaborHub — Gestão e Catálogo Gastronômico</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #f1f5f9;
            --bg-card: #ffffff;
            --bg-sidebar: #0f172a;
            --brand-primary: #10b981;
            --brand-hover: #059669;
            --text-dark: #1e293b;
            --text-secondary: #64748b;
            --border-light: #e2e8f0;
            --amber: #f59e0b;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
        }

        /* Sidebar Lateral */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            padding: 28px 20px;
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 40px;
            padding: 0 8px;
        }

        .brand-badge {
            background: var(--brand-primary);
            color: #0f172a;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .menu-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .menu-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #ffffff;
        }

        .menu-btn.active {
            background: var(--brand-primary);
            color: #0f172a;
            font-weight: 700;
        }

        .counter-pill {
            background: rgba(15, 23, 42, 0.25);
            padding: 2px 8px;
            border-radius: 99px;
            font-size: 12px;
        }

        /* Conteúdo Principal */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 40px;
            width: 100%;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .top-bar h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 10px 16px;
            width: 340px;
            gap: 10px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        .search-box input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 14px;
            color: var(--text-dark);
        }

        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            overflow-x: auto;
            padding-bottom: 6px;
        }

        .tag-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-light);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }

        .tag-btn.active {
            background: var(--text-dark);
            color: #ffffff;
            border-color: var(--text-dark);
        }

        /* Grid de Restaurantes */
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 20px;
        }

        .place-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .place-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.08);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .avatar-box {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }

        .fav-btn {
            background: #f8fafc;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            width: 36px;
            height: 36px;
            cursor: pointer;
            font-size: 16px;
        }

        .place-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .place-category {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid var(--border-light);
            font-size: 13px;
        }

        .score-badge {
            background: #fffbeb;
            color: #b45309;
            border: 1px solid #fde68a;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 700;
        }

        /* Painel de Cadastro */
        .form-panel {
            display: none;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            padding: 32px;
            max-width: 560px;
        }

        .form-panel.visible {
            display: block;
        }

        .field-row {
            margin-bottom: 18px;
        }

        .field-row label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-dark);
        }

        .field-row input,
        .field-row select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-light);
            border-radius: 10px;
            font-size: 14px;
            background: #f8fafc;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--brand-primary);
            color: #0f172a;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-primary:hover {
            background: var(--brand-hover);
            color: #ffffff;
        }

        .alert-box {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            display: none;
        }

        .alert-box.ok {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .alert-box.fail {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .status-msg {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px;
            color: var(--text-secondary);
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px dashed var(--border-light);
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-badge">🥗</div>
            <span>SaborHub</span>
        </div>

        <nav class="menu-list">
            <button class="menu-btn active" data-tab="catalog" onclick="changeTab('catalog')">
                <span>📋 Catálogo Geral</span>
            </button>
            <button class="menu-btn" data-tab="create" onclick="changeTab('create')">
                <span>➕ Novo Restaurante</span>
            </button>
            <button class="menu-btn" data-tab="saved" onclick="changeTab('saved')">
                <span>⭐ Salvos</span>
                <span class="counter-pill" id="saved-counter">0</span>
            </button>
        </nav>
    </aside>

    <main class="workspace">
        <header class="top-bar">
            <h1 id="page-heading">Estabelecimentos Parceiros</h1>
            <div class="search-box" id="search-container">
                <span>🔍</span>
                <input type="text" id="query-input" placeholder="Filtrar por nome ou culinária...">
            </div>
        </header>

        <section class="filter-bar" id="filter-bar">
            <button class="tag-btn active" data-filter="Todos">Todos</button>
            <button class="tag-btn" data-filter="Destaques">★ Acima de 4.5</button>
            <button class="tag-btn" data-filter="Brasileira">🍛 Brasileira</button>
            <button class="tag-btn" data-filter="Burger">🍔 Burger</button>
            <button class="tag-btn" data-filter="Pizza">🍕 Pizza</button>
            <button class="tag-btn" data-filter="Japonesa">🍣 Japonesa</button>
            <button class="tag-btn" data-filter="Saudável">🥗 Saudável</button>
        </section>

        <section class="catalog-grid" id="catalog-grid"></section>

        <section class="form-panel" id="create-panel">
            <form id="restaurant-form">
                <div class="field-row">
                    <label for="f-name">Nome do Estabelecimento</label>
                    <input type="text" id="f-name" placeholder="Ex: Cantina Bella Napoli" required>
                </div>
                <div class="field-row">
                    <label for="f-category">Especialidade Culinária</label>
                    <select id="f-category" required>
                        <option value="">Selecione...</option>
                        <option value="Brasileira">Brasileira</option>
                        <option value="Burger">Burger</option>
                        <option value="Pizza">Pizza</option>
                        <option value="Japonesa">Japonesa</option>
                        <option value="Saudável">Saudável</option>
                        <option value="Italiana">Italiana</option>
                    </select>
                </div>
                <div class="field-row">
                    <label for="f-rating">Avaliação Inicial (0 a 5)</label>
                    <input type="number" id="f-rating" min="0" max="5" step="0.1" value="4.8" required>
                </div>
                <button type="submit" class="btn-primary" id="save-btn">Confirmar Cadastro</button>
                <div class="alert-box" id="feedback-box"></div>
            </form>
        </section>
    </main>

    <script>
        const ENDPOINT_RESTAURANTS = 'http://localhost:3000/restaurants';
        const STORAGE_FAVS_KEY = 'saborhub_saved_ids';
        const STORAGE_TOKEN_KEY = 'saborhub_jwt';

        let restaurantDataset = [];
        let activeFilter = 'Todos';
        let activeQuery = '';
        let activeTab = 'catalog';
        let savedIds = JSON.parse(localStorage.getItem(STORAGE_FAVS_KEY) || '[]');

        const iconsByCategory = {
            'Brasileira': '🍛',
            'Burger': '🍔',
            'Pizza': '🍕',
            'Japonesa': '🍣',
            'Sushi': '🍣',
            'Saudável': '🥗',
            'Italiana': '🍝'
        };

        function refreshCounter() {
            document.getElementById('saved-counter').textContent = savedIds.length;
        }

        function toggleSaved(id) {
            const numericId = Number(id);
            if (savedIds.includes(numericId)) {
                savedIds = savedIds.filter(item => item !== numericId);
            } else {
                savedIds.push(numericId);
            }
            localStorage.setItem(STORAGE_FAVS_KEY, JSON.stringify(savedIds));
            refreshCounter();
            renderCatalog();
        }

        async function loadCatalog() {
            const grid = document.getElementById('catalog-grid');
            grid.innerHTML = '<div class="status-msg">Sincronizando dados com a API SaborHub...</div>';

            try {
                const res = await fetch(ENDPOINT_RESTAURANTS);
                restaurantDataset = await res.json();
                refreshCounter();
                renderCatalog();
            } catch (err) {
                grid.innerHTML = '<div class="status-msg">⚠️ API indisponível em localhost:3000. Inicie com <b>npm start</b>.</div>';
            }
        }

        function renderCatalog() {
            const grid = document.getElementById('catalog-grid');

            const list = restaurantDataset.filter(item => {
                if (activeTab === 'saved' && !savedIds.includes(Number(item.id))) {
                    return false;
                }
                const matchesCategory = activeFilter === 'Todos'
                    ? true
                    : activeFilter === 'Destaques'
                        ? Number(item.rating) >= 4.5
                        : item.category === activeFilter;

                const matchesText = item.name.toLowerCase().includes(activeQuery.toLowerCase()) ||
                    (item.category && item.category.toLowerCase().includes(activeQuery.toLowerCase()));

                return matchesCategory && matchesText;
            });

            if (list.length === 0) {
                grid.innerHTML = '<div class="status-msg">Nenhum estabelecimento encontrado para os critérios selecionados.</div>';
                return;
            }

            grid.innerHTML = list.map(r => {
                const isSaved = savedIds.includes(Number(r.id));
                const icon = iconsByCategory[r.category] || '🍽️';
                const dishCount = Array.isArray(r.dishes) ? r.dishes.length : 0;

                return `
                    <article class="place-card">
                        <div class="card-header">
                            <div class="avatar-box">${icon}</div>
                            <button class="fav-btn" onclick="toggleSaved(${r.id})">
                                ${isSaved ? '⭐' : '☆'}
                            </button>
                        </div>
                        <div>
                            <div class="place-title">${r.name}</div>
                            <div class="place-category">${r.category || 'Geral'} • ${dishCount} pratos no cardápio</div>
                        </div>
                        <div class="card-footer">
                            <span class="score-badge">★ ${Number(r.rating).toFixed(1)}</span>
                            <span style="color: var(--brand-hover); font-weight: 600;">Entrega Ativa</span>
                        </div>
                    </article>
                `;
            }).join('');
        }

        function changeTab(tabName) {
            activeTab = tabName;
            document.querySelectorAll('.menu-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tabName);
            });

            const isCreate = tabName === 'create';
            document.getElementById('create-panel').classList.toggle('visible', isCreate);
            document.getElementById('catalog-grid').style.display = isCreate ? 'none' : 'grid';
            document.getElementById('filter-bar').style.display = isCreate ? 'none' : 'flex';
            document.getElementById('search-container').style.display = isCreate ? 'none' : 'flex';

            const titles = {
                catalog: 'Estabelecimentos Parceiros',
                create: 'Cadastrar Novo Restaurante',
                saved: 'Meus Restaurantes Salvos'
            };
            document.getElementById('page-heading').textContent = titles[tabName];

            if (!isCreate) renderCatalog();
        }

        document.getElementById('query-input').addEventListener('input', e => {
            activeQuery = e.target.value.trim();
            renderCatalog();
        });

        document.querySelectorAll('.tag-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeFilter = btn.dataset.filter;
                renderCatalog();
            });
        });

        async function obtainAuthToken() {
            let token = localStorage.getItem(STORAGE_TOKEN_KEY);
            if (token) return token;

            const demoCredentials = {
                name: 'Vitor Admin',
                email: 'admin@saborhub.local',
                password: 'saborhub_password_123'
            };

            try {
                await fetch('http://localhost:3000/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(demoCredentials)
                });
            } catch (_) {}

            const loginResp = await fetch('http://localhost:3000/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: demoCredentials.email,
                    password: demoCredentials.password
                })
            });

            if (loginResp.ok) {
                const data = await loginResp.json();
                localStorage.setItem(STORAGE_TOKEN_KEY, data.token);
                return data.token;
            }
            return null;
        }

        document.getElementById('restaurant-form').addEventListener('submit', async e => {
            e.preventDefault();
            const feedback = document.getElementById('feedback-box');
            const btn = document.getElementById('save-btn');

            const payload = {
                name: document.getElementById('f-name').value.trim(),
                category: document.getElementById('f-category').value,
                rating: parseFloat(document.getElementById('f-rating').value)
            };

            btn.disabled = true;
            btn.textContent = 'Processando...';

            try {
                const jwt = await obtainAuthToken();
                const response = await fetch(ENDPOINT_RESTAURANTS, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${jwt}`
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error();

                const created = await response.json();
                restaurantDataset.unshift(created);
                e.target.reset();
                feedback.textContent = `Restaurante "${created.name}" registrado com sucesso!`;
                feedback.className = 'alert-box ok';
            } catch (err) {
                feedback.textContent = 'Erro ao registrar restaurante na API.';
                feedback.className = 'alert-box fail';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Confirmar Cadastro';
            }
        });

        loadCatalog();
    </script>
</body>
</html>
